#[Basic Formatting]
indent_style = "Block"
disable_all_formatting = false
newline_style = "Auto"
max_width = 60
tab_spaces = 2
hard_tabs = false
color = "Auto"

#[Spacing]
blank_lines_lower_bound = 0
blank_lines_upper_bound = 1
space_after_colon = true
space_before_colon = false
spaces_around_ranges = false
type_punctuation_density = "Wide"
trailing_comma = "Vertical"
trailing_semicolon = true

#[Braces]
brace_style = "PreferSameLine"
control_brace_style = "ClosingNextLine"
force_multiline_blocks = false
empty_item_single_line = true

#[Expressions]
binop_separator = "Back"
combine_control_expr = true
overflow_delimited_expr = true
remove_nested_parens = true
single_line_if_else_max_width = 0
single_line_let_else_max_width = 0
use_small_heuristics = "off"

#[Arrays]
array_width = 1
short_array_element_width_threshold = 1

#[Functions]
attr_fn_like_width = 1
fn_params_layout = "Vertical"
fn_call_width = 1
fn_single_line = true
force_explicit_abi = true
where_single_line = false
chain_width = 1

#[Imports]
reorder_imports = true
imports_indent = "Block"
imports_layout = "Vertical"
imports_granularity = "Crate"
group_imports = "StdExternalCrate"

#[Modules]
reorder_modules = true
skip_children = false

#[Impl]
reorder_impl_items = true

#[Structs]
struct_field_align_threshold = 20
struct_lit_single_line = false
struct_lit_width = 0
struct_variant_width = 0

#[Enums]
enum_discrim_align_threshold = 20

#[Match]
match_arm_blocks = true
match_arm_leading_pipes = "Always"
match_arm_indent = true
match_block_trailing_comma = true

#[Comments]
comment_width = 60
normalize_comments = false
wrap_comments = true

#[Documentation]
normalize_doc_attributes = false
format_code_in_doc_comments = false
doc_comment_code_block_width = 60
doc_comment_code_block_small_heuristics = "Default"

#[Macros]
format_macro_matchers = true
format_macro_bodies = true
skip_macro_invocations = []

#[Strings]
format_strings = true

#[Literals]
hex_literal_case = "Upper"
float_literal_trailing_zero = "Always"

#[Fields]
use_field_init_shorthand = true

#[Errors]
error_on_line_overflow = false
error_on_unformatted = false
show_parse_errors = true

#[Files]
ignore = []
format_generated_files = true
generated_marker_line_search_limit = 5

#[Rust Edition]
edition = "2024"
style_edition = "2024"

# [Opção desnecessária]
# required_version = "1.11.0"

# [Formatting Version]
# version = "Two"

#[Features]
unstable_features = true

#[Try]
use_try_shorthand = false


# the `merge_imports` option is deprecated. Use `imports_granularity="Crate"` instead
#
#   hide_parse_errors = false
#

# the `fn_args_layout` option is deprecated. Use `fn_params_layout`. instead
#
#   fn_args_layout = "Vertical"
#

# the `hide_parse_errors` option is deprecated. Use `show_parse_errors` instead
#
#   merge_imports = false
#